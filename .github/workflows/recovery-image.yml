name: Native Recovery image input check and build

# Manual, secret-free qualification of the edge image with the native Recovery
# app, from any branch: the release image (mac-image.yml) builds the same app
# with the same workflow (recovery-app.yml), but only from main. No releases,
# catalogs or deployment. Default: authenticate the real edge channel inputs
# and freeze the native template. A full image build is opt-in and still does
# not qualify a hardware boot.
on:
  workflow_dispatch:
    inputs:
      build-image:
        description: Build the full image after authenticating inputs
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  recovery:
    name: Build the native Recovery image input
    uses: ./.github/workflows/recovery-app.yml
    permissions:
      contents: read

  image:
    name: Check real edge channel inputs, optionally build
    needs: recovery
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      BUILD_IMAGE: ${{ inputs.build-image }}
      RECOVERY_SHA256: ${{ needs.recovery.outputs.manifest-sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set the work directory
        run: echo "WORK=$RUNNER_TEMP/recovery-image" >>"$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.recovery.outputs.artifact }}
          path: ${{ runner.temp }}/recovery-image/recovery
      - name: Install input verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools jq gnupg zstd xz-utils
      - name: Resolve and authenticate the real edge package set
        run: |
          mkdir -p "$WORK/evidence"
          [[ $RECOVERY_SHA256 =~ ^[0-9a-f]{64}$ ]] || { echo "::error::the Recovery job reported no inventory digest"; exit 1; }
          tar -xf "$WORK/recovery/native-recovery.tar" -C "$WORK/recovery"
          # The app the Recovery job built, file for file (builder/recovery_app.py).
          python3 image-builder/builder/recovery_app.py "$WORK/recovery" --sha256 "$RECOVERY_SHA256"
          bash image-builder/bin/mac-image-inputs resolve "$WORK/inputs" --channel-set --channel edge --recovery-app "$WORK/recovery" --cache "$WORK/cache" 2>&1 | tee "$WORK/evidence/resolve.log"
          cp "$WORK/inputs" "$WORK/evidence/inputs"
          cp "$WORK/recovery/source.txt" "$WORK/evidence/recovery-source.txt"
          options=(--dry-run)
          [[ $BUILD_IMAGE != true ]] || options=()
          bash image-builder/bin/build-mac-image --inputs "$WORK/inputs" --recovery-app "$WORK/recovery" --cache "$WORK/cache" "${options[@]}" "$WORK/out" 2>&1 | tee "$WORK/evidence/build.log"
      - name: Check a completed image
        if: inputs.build-image
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$WORK/out"
          python3 image-builder/bin/mac-image-check provenance edge "$WORK/out"
          python3 image-builder/bin/mac-image-check descriptor edge "$WORK/out"
          sudo python3 image-builder/bin/mac-release-guard build "$WORK/out" 2>&1 | tee "$WORK/evidence/release-guard.log"
      - name: Save qualification artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovery-image-qualification
          path: |
            ${{ runner.temp }}/recovery-image/evidence/
            ${{ runner.temp }}/recovery-image/out/
          retention-days: 14
